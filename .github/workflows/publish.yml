name: Publish language packs

on:
  push:
    branches: [ main ]
    paths:
      - 'avada-one.pot'
      - 'po/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: sudo apt-get update -q && sudo apt-get install -y -q gettext
      - run: npm ci

      # Merge the latest avada-one.pot into every language and commit the result.
      # Pushes made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
      - name: Sync po files with the pot file
        run: |
          node scripts/sync.js
          if ! git diff --quiet -- po; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add po
            git commit -m "Sync translations with avada-one.pot"
            git push
          fi

      - name: Check translations
        run: node scripts/validate.js | tee -a "$GITHUB_STEP_SUMMARY"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build language packs
        run: node scripts/build.js --base-url "${{ steps.pages.outputs.base_url }}" --out dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
